<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OblivionX Engine Elite</title>

    <style>
        :root{
            --accent:#8C5AFF;
            --bg:#000000;
            --panel:#050505;
            --panel-sub:#0c0c0f;
            --border:rgba(255,255,255,0.08);
            --text-main:#ffffff;
            --text-dim:#666666;
            --tab-active:#111111;
            --modal-bg:rgba(10,10,12,0.95);
            --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
        }

        .theme-purple{
            --accent:#8C5AFF;
            --bg:#060608;
            --panel:#0b0b0e;
            --panel-sub:#111116;
        }

        .theme-gold{
            --accent:#FEE227;
            --bg:#080805;
            --panel:#0f0f0a;
            --panel-sub:#181810;
        }

        .theme-vampire{
            --accent:#FF3131;
            --bg:#080303;
            --panel:#120606;
            --panel-sub:#1c0a0a;
        }

        .theme-ocean{
            --accent:#00D1FF;
            --bg:#03070a;
            --panel:#060b12;
            --panel-sub:#0a121e;
        }

        .theme-matrix{
            --accent:#00FF41;
            --bg:#020502;
            --panel:#050a05;
            --panel-sub:#0a140a;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            outline:none;
        }

        body,html{
            width:100%;
            height:100%;
            overflow:hidden;
            background:var(--bg);
            color:#fff;
            font-family:Inter,sans-serif;
        }

        #weather-canvas{
            position:absolute;
            inset:0;
            z-index:1;
            pointer-events:none;
            opacity:.25;
        }

        .app-shell{
            position:relative;
            z-index:2;
            width:100%;
            height:100%;
            display:flex;
            flex-direction:column;
            border:1px solid var(--border);
            backdrop-filter:blur(10px);
        }

        .topbar{
            height:48px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 16px;
            border-bottom:1px solid var(--border);
            background:rgba(0,0,0,.55);
        }

        .brand-wrapper{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .logo{
            font-size:11px;
            font-weight:800;
            letter-spacing:2px;
            color:#777;
        }

        .logo span{
            color:var(--accent);
        }

        .status-badge-container{
            display:flex;
            align-items:center;
            gap:6px;
            border:1px solid var(--border);
            padding:4px 8px;
            border-radius:6px;
            font-size:9px;
            text-transform:uppercase;
            color:#999;
            background:rgba(255,255,255,.02);
        }

        .attach-indicator-dot{
            width:6px;
            height:6px;
            border-radius:50%;
            background:#333;
        }

        .attach-indicator-dot.active{
            background:var(--accent);
            box-shadow:0 0 10px var(--accent);
        }

        .attach-indicator-dot.failed{
            background:#ff4444;
            box-shadow:0 0 10px #ff4444;
        }

        .header-actions{
            display:flex;
            gap:6px;
            align-items:center;
        }

        .icon-btn{
            background:transparent;
            border:1px solid var(--border);
            color:#999;
            border-radius:6px;
            padding:7px 12px;
            cursor:pointer;
            font-size:11px;
            display:flex;
            align-items:center;
            gap:6px;
            transition:.2s;
        }

        .icon-btn:hover{
            border-color:var(--accent);
            color:#fff;
        }

        .icon-btn svg{
            width:12px;
            height:12px;
            stroke:currentColor;
            fill:none;
            stroke-width:2;
        }

        .window-control-btn{
            width:28px;
            height:28px;
            border-radius:6px;
            border:1px solid var(--border);
            background:transparent;
            color:#999;
            cursor:pointer;
        }

        .window-control-btn:hover{
            color:#fff;
        }

        .workspace-grid{
            flex:1;
            display:flex;
            overflow:hidden;
        }

        .editor-container{
            flex:1;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        .tab-bar{
            height:38px;
            background:var(--panel-sub);
            border-bottom:1px solid var(--border);
            display:flex;
            align-items:center;
            padding:0 8px;
        }

        #tab-container{
            display:flex;
            gap:4px;
        }

        .tab{
            padding:5px 12px;
            border-radius:6px;
            font-size:11px;
            cursor:pointer;
            color:#888;
            display:flex;
            align-items:center;
            gap:8px;
            border:1px solid transparent;
        }

        .tab.active{
            background:var(--tab-active);
            color:#fff;
            border-color:var(--border);
        }

        .close-x{
            opacity:.4;
        }

        .close-x:hover{
            color:#ff4444;
            opacity:1;
        }

        main{
            flex:1;
            position:relative;
        }

        #editor{
            width:100%;
            height:100%;
        }

        .cli-bar{
            height:42px;
            display:flex;
            align-items:center;
            gap:10px;
            border-top:1px solid var(--border);
            padding:0 16px;
            background:#050505;
        }

        .cli-input{
            flex:1;
            background:transparent;
            border:none;
            color:#fff;
            font-size:12px;
            font-family:monospace;
        }

        #status-glow{
            width:6px;
            height:6px;
            border-radius:50%;
            background:#333;
        }

        .modal-overlay{
            position:absolute;
            inset:0;
            display:none;
            align-items:center;
            justify-content:center;
            background:rgba(0,0,0,.7);
            backdrop-filter:blur(12px);
            z-index:100;
        }

        .modal-card{
            background:var(--modal-bg);
            border:1px solid var(--border);
            border-radius:16px;
            box-shadow:0 25px 60px rgba(0,0,0,.6);
        }

        .settings-card{
            width:460px;
            padding:24px;
        }

        .scripthub-card{
            width:700px;
            padding:24px;
            display:flex;
            flex-direction:column;
            gap:16px;
            max-height:85vh;
        }

        .hub-search-bar{
            display:flex;
            gap:8px;
        }

        .hub-search-input{
            flex:1;
            background:#09090b;
            border:1px solid var(--border);
            color:#fff;
            padding:10px 14px;
            border-radius:8px;
            font-size:12px;
        }

        .hub-catalog-list{
            display:flex;
            flex-direction:column;
            gap:10px;
            overflow-y:auto;
            max-height:55vh;
            padding-right:4px;
        }

        .hub-catalog-list::-webkit-scrollbar{
            width:4px;
        }

        .hub-catalog-list::-webkit-scrollbar-thumb{
            background:var(--accent);
            border-radius:2px;
        }

        .script-card-item{
            border:1px solid var(--border);
            border-radius:10px;
            padding:14px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:14px;
            background:rgba(255,255,255,.015);
        }

        .script-card-item:hover{
            border-color:rgba(255,255,255,.16);
        }

        .script-info{
            display:flex;
            flex-direction:column;
            gap:4px;
        }

        .script-title-row{
            display:flex;
            align-items:center;
            gap:6px;
            flex-wrap:wrap;
        }

        .script-title{
            font-size:13px;
            font-weight:700;
        }

        .script-badge{
            font-size:9px;
            padding:2px 6px;
            border-radius:4px;
            background:rgba(255,255,255,.05);
            color:#bbb;
            font-weight:700;
            text-transform:uppercase;
        }

        .script-badge.universal{
            background:rgba(140,90,255,.15);
            color:#b392ff;
        }

        .script-badge.verified{
            background:rgba(0,209,255,.15);
            color:#66e3ff;
        }

        .script-badge.patched{
            background:rgba(255,49,49,.15);
            color:#ff7e7e;
        }

        .script-desc{
            color:#888;
            font-size:11px;
            max-width:450px;
            line-height:15px;
        }

        .script-meta-metrics{
            display:flex;
            gap:14px;
            font-size:10px;
            color:#555;
        }

        .script-meta-metrics span span{
            color:#ddd;
        }

        .setting-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:14px;
            gap:14px;
            font-size:12px;
        }

        .setting-desc{
            color:#777;
            font-size:10px;
        }

        .modal-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .modal-title{
            font-size:14px;
            font-weight:800;
            letter-spacing:1px;
        }

        .switch{
            position:relative;
            width:34px;
            height:20px;
        }

        .switch input{
            opacity:0;
            width:0;
            height:0;
        }

        .slider{
            position:absolute;
            inset:0;
            background:#222;
            border:1px solid var(--border);
            border-radius:20px;
            cursor:pointer;
        }

        .slider:before{
            content:"";
            position:absolute;
            width:12px;
            height:12px;
            border-radius:50%;
            background:#fff;
            left:3px;
            bottom:3px;
            transition:.2s;
        }

        input:checked + .slider{
            background:var(--accent);
        }

        input:checked + .slider:before{
            transform:translateX(14px);
        }

        .form-select,
        .form-input{
            width:160px;
            padding:6px 10px;
            border-radius:6px;
            border:1px solid var(--border);
            background:#09090b;
            color:#fff;
            font-size:11px;
        }
    </style>
</head>

<body class="theme-purple">

<canvas id="weather-canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.0/min/vs/loader.min.js"></script>

<script>

let editor;

let files = JSON.parse(localStorage.getItem('obv_fs')) || {
    "main.lua":"print('OblivionX Ready')"
};

let current = "main.lua";

function sendWebviewMessage(payload){

    if(
        window.chrome &&
        window.chrome.webview &&
        typeof window.chrome.webview.postMessage === 'function'
    ){
        window.chrome.webview.postMessage(payload);
    }
    else{
        console.log("[MOCK SEND]",payload);

        mockBackend(payload);
    }
}

/* =========================================
   MOCK BACKEND
========================================= */

function mockBackend(payload){

    if(payload.action === "scriptblox_fetch_trending"){

        setTimeout(()=>{

            populateScriptHubCatalog({
                result:[
                    {
                        _id:"1",
                        title:"Infinite Yield",
                        features:"Universal admin commands script.",
                        views:400000,
                        likeCount:12000,
                        verified:true,
                        universal:true,
                        game:{name:"Universal"}
                    },
                    {
                        _id:"2",
                        title:"BedWars OP GUI",
                        features:"Auto farm, kill aura, teleport.",
                        views:210000,
                        likeCount:7600,
                        patched:false,
                        verified:true,
                        game:{name:"BedWars"}
                    },
                    {
                        _id:"3",
                        title:"Doors Script",
                        features:"ESP, auto rooms, anti seek.",
                        views:95000,
                        likeCount:4100,
                        game:{name:"Doors"}
                    }
                ]
            });

        },600);
    }

    if(payload.action === "scriptblox_search"){

        setTimeout(()=>{

            populateScriptHubCatalog({
                result:[
                    {
                        _id:"99",
                        title:payload.query + " Script",
                        features:"Search result for " + payload.query,
                        views:12345,
                        likeCount:555,
                        verified:true,
                        game:{name:"Universal"}
                    }
                ]
            });

        },500);
    }

    if(payload.action === "scriptblox_get_raw"){

        setTimeout(()=>{

            injectRawScriptIntoEditor(
                payload.title,
`-- ${payload.title}
print("Loaded from Script Hub")

while true do
    wait(1)
    print("Running...")
end`
            );

        },400);
    }
}

/* =========================================
   MONACO
========================================= */

require.config({
    paths:{
        vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.0/min/vs"
    }
});

require(["vs/editor/editor.main"],function(){

    editor = monaco.editor.create(
        document.getElementById("editor"),
        {
            value:files[current],
            language:"lua",
            theme:"vs-dark",
            automaticLayout:true,
            minimap:{enabled:false},
            fontSize:13,
            fontFamily:'JetBrains Mono, monospace'
        }
    );

    editor.onDidChangeModelContent(save);

    renderTabs();
});

/* =========================================
   FILES
========================================= */

function save(){

    if(!editor) return;

    files[current] = editor.getValue();

    localStorage.setItem(
        'obv_fs',
        JSON.stringify(files)
    );
}

function renderTabs(){

    const container = document.getElementById("tab-container");

    container.innerHTML = "";

    Object.keys(files).forEach(f=>{

        const tab = document.createElement("div");

        tab.className =
            "tab" + (f === current ? " active" : "");

        tab.innerHTML =
            `<span>${f}</span>
             <span class="close-x">×</span>`;

        tab.onclick = ()=>switchActiveBuffer(f);

        tab.querySelector(".close-x").onclick = (e)=>{
            e.stopPropagation();
            closeTab(f);
        };

        container.appendChild(tab);
    });
}

function switchActiveBuffer(file){

    save();

    current = file;

    editor.setValue(files[file]);

    renderTabs();
}

function createNewTab(title,content){

    files[title] = content;

    current = title;

    renderTabs();

    editor.setValue(content);

    save();
}

function closeTab(file){

    if(Object.keys(files).length <= 1) return;

    delete files[file];

    current = Object.keys(files)[0];

    editor.setValue(files[current]);

    renderTabs();

    save();
}

/* =========================================
   MODALS
========================================= */

function openModal(id){
    document.getElementById(id).style.display = 'flex';
}

function closeModal(id){
    document.getElementById(id).style.display = 'none';
}

function closeModalOnOuter(e,id){

    if(e.target.id === id){
        closeModal(id);
    }
}

/* =========================================
   THEME
========================================= */

function applyGlobalTheme(name){

    document.body.className = `theme-${name}`;

    localStorage.setItem('obv_theme',name);

    if(window.monaco){

        const accent =
            getComputedStyle(document.body)
            .getPropertyValue('--accent')
            .trim();

        const bg =
            getComputedStyle(document.body)
            .getPropertyValue('--bg')
            .trim();

        monaco.editor.defineTheme('obv-theme',{
            base:'vs-dark',
            inherit:true,
            rules:[],
            colors:{
                'editor.background':bg,
                'editorCursor.foreground':accent
            }
        });

        monaco.editor.setTheme('obv-theme');
    }
}

/* =========================================
   STATUS UI
========================================= */

function updateStatusUI(mode,pid=null){

    const dot =
        document.getElementById('top-attach-dot');

    const txt =
        document.getElementById('status-text');

    if(mode === "attached"){

        dot.className =
            "attach-indicator-dot active";

        txt.innerText =
            `Attached (${pid})`;
    }
    else if(mode === "failed"){

        dot.className =
            "attach-indicator-dot failed";

        txt.innerText =
            "Injection Failed";
    }
    else{

        dot.className =
            "attach-indicator-dot";

        txt.innerText =
            "Not Attached";
    }
}

/* =========================================
   SCRIPT HUB
========================================= */

let lastHubQuery = "";

function openScriptHub(){

    openModal('script-hub-modal');

    loadTrendingScripts();
}

function loadTrendingScripts(){

    updateHubStatus(
        "Fetching trending scripts..."
    );

    sendWebviewMessage({
        action:"scriptblox_fetch_trending"
    });
}

function triggerHubQuerySearch(){

    const input =
        document.getElementById('hub-search-input');

    const query =
        input.value.trim();

    if(!query.length){

        loadTrendingScripts();

        return;
    }

    if(query === lastHubQuery) return;

    lastHubQuery = query;

    updateHubStatus(
        `Searching for "${query}"...`
    );

    sendWebviewMessage({
        action:"scriptblox_search",
        query:query
    });
}

function handleHubSearchKey(e){

    if(e.key === "Enter"){
        triggerHubQuerySearch();
    }
}

function updateHubStatus(text){

    const status =
        document.getElementById('hub-catalog-status');

    status.innerText = text;
}

function escapeHtml(str=""){

    return str
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function sanitizeText(str=""){

    return String(str)
        .replace(/<[^>]*>/g,'');
}

window.populateScriptHubCatalog =
function(responseObj){

    const listContainer =
        document.getElementById(
            'hub-catalog-list'
        );

    listContainer.innerHTML = "";

    let scriptsArray = [];

    if(Array.isArray(responseObj)){
        scriptsArray = responseObj;
    }
    else if(Array.isArray(responseObj.result)){
        scriptsArray = responseObj.result;
    }
    else if(responseObj.result?.scripts){
        scriptsArray =
            responseObj.result.scripts;
    }
    else if(responseObj.scripts){
        scriptsArray =
            responseObj.scripts;
    }

    if(!scriptsArray.length){

        updateHubStatus(
            "No scripts found."
        );

        return;
    }

    updateHubStatus(
        `Loaded ${scriptsArray.length} scripts.`
    );

    scriptsArray.forEach(item=>{

        const title =
            sanitizeText(
                item.title ||
                item.name ||
                "Unnamed Script"
            );

        const description =
            sanitizeText(
                item.features ||
                item.description ||
                "No description available."
            );

        const game =
            sanitizeText(
                item.game?.name ||
                "Universal"
            );

        const views =
            item.views || 0;

        const likes =
            item.likeCount || 0;

        const verified =
            item.verified === true;

        const universal =
            item.universal === true;

        const patched =
            item.patched === true;

        const scriptId =
            item._id ||
            item.id ||
            "";

        let badges = "";

        if(universal){
            badges +=
                `<span class="script-badge universal">
                    Universal
                 </span>`;
        }

        if(verified){
            badges +=
                `<span class="script-badge verified">
                    Verified
                 </span>`;
        }

        if(patched){
            badges +=
                `<span class="script-badge patched">
                    Patched
                 </span>`;
        }

        const card =
            document.createElement("div");

        card.className =
            "script-card-item";

        card.innerHTML = `
            <div class="script-info">

                <div class="script-title-row">

                    <span class="script-title">
                        ${escapeHtml(title)}
                    </span>

                    ${badges}

                </div>

                <div class="script-desc">
                    ${escapeHtml(description)}
                </div>

                <div class="script-meta-metrics">

                    <span>
                        Game:
                        <span>${escapeHtml(game)}</span>
                    </span>

                    <span>
                        Views:
                        <span>${views}</span>
                    </span>

                    <span>
                        Likes:
                        <span>${likes}</span>
                    </span>

                </div>

            </div>

            <button
                class="icon-btn"
                style="
                    border-color:var(--accent);
                    color:#fff;
                    font-weight:700;
                "
            >
                Load Code
            </button>
        `;

        const btn =
            card.querySelector("button");

        btn.onclick = ()=>{

            requestRawScript(
                scriptId,
                title
            );
        };

        listContainer.appendChild(card);
    });
};

function requestRawScript(scriptId,title){

    updateHubStatus(
        `Loading "${title}"...`
    );

    sendWebviewMessage({
        action:"scriptblox_get_raw",
        id:scriptId,
        title:title
    });
}

window.injectRawScriptIntoEditor =
function(title,rawCode){

    closeModal('script-hub-modal');

    let workspaceTitle =
        title
        .toLowerCase()
        .replace(/[^a-z0-9]/gi,'_')
        .replace(/_+/g,'_');

    if(!workspaceTitle.endsWith(".lua")){
        workspaceTitle += ".lua";
    }

    createNewTab(
        workspaceTitle,
        rawCode
    );
};

/* =========================================
   CLI
========================================= */

document
.getElementById("cli")
.addEventListener("keydown",e=>{

    if(e.key !== "Enter") return;

    const cmd =
        e.target.value
        .trim()
        .toLowerCase();

    if(cmd === "/run"){

        sendWebviewMessage({
            action:"execute",
            code:editor.getValue()
        });
    }

    if(cmd === "/inject"){

        sendWebviewMessage({
            action:"inject"
        });

        updateStatusUI(
            'attached',
            Math.floor(Math.random()*9999)
        );
    }

    if(cmd === "/new"){

        createNewTab(
            "script_" +
            Date.now() +
            ".lua",

            "-- New Script"
        );
    }

    e.target.value = "";
});

/* =========================================
   WEATHER
========================================= */

const canvas =
    document.getElementById(
        'weather-canvas'
    );

const ctx =
    canvas.getContext('2d');

function resizeCanvas(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

window.addEventListener(
    'resize',
    resizeCanvas
);

resizeCanvas();

let particles = [];

for(let i=0;i<120;i++){

    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        speed:2+Math.random()*5
    });
}

function renderWeather(){

    const accent =
        getComputedStyle(document.body)
        .getPropertyValue('--accent')
        .trim();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = accent;

    ctx.font = "12px monospace";

    particles.forEach(p=>{

        ctx.fillText(
            String.fromCharCode(
                0x30A0 +
                Math.random()*96
            ),
            p.x,
            p.y
        );

        p.y += p.speed;

        if(p.y > canvas.height){
            p.y = -20;
        }
    });

    requestAnimationFrame(
        renderWeather
    );
}

renderWeather();

</script>
