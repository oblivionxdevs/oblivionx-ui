<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OblivionX</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect fill='%237c6af7' width='16' height='16'/><text x='8' y='12' text-anchor='middle' fill='white' font-size='12' font-weight='bold' font-family='monospace'>X</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/toolbar.css" />
  <link rel="stylesheet" href="styles/editor.css" />
  <link rel="stylesheet" href="styles/animations.css" />
</head>
<body>
  <div id="loading-overlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <div class="loading-text">
        <strong>Loading OblivionX</strong>
        <p>Please wait while the UI initializes...</p>
      </div>
    </div>
  </div>

  <!-- Title Bar -->
  <div class="titlebar" id="titlebar">
    <div class="traffic-lights">
      <button class="traffic-light tl-close" id="btn-close" title="Close">
        <svg viewBox="0 0 10 10" width="6" height="6"><path d="M1,1 L9,9 M9,1 L1,9" stroke="rgba(0,0,0,0.5)" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="traffic-light tl-minimize" id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 10 10" width="8" height="2"><line x1="1" y1="5" x2="9" y2="5" stroke="rgba(0,0,0,0.5)" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="traffic-light tl-maximize" id="btn-maximize" title="Maximize">
        <svg viewBox="0 0 10 10" width="6" height="6"><rect x="1.5" y="1.5" width="7" height="7" rx="1.5" stroke="rgba(0,0,0,0.5)" stroke-width="1.5" fill="none"/></svg>
      </button>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar" id="tab-bar">
      <div class="tabs-scroll" id="tabs-container">
        <!-- tabs injected by JS -->
      </div>
      <button class="tab-add-btn" id="btn-add-tab" title="New Tab">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-center">
      <button class="toolbar-btn execute-btn" id="btn-execute" data-tooltip="Execute Script (F5)">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
          <polygon points="3,2 13,8 3,14"/>
        </svg>
        Execute
      </button>
      <button class="toolbar-btn" id="btn-clear" data-tooltip="Clear Editor">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h10l-1 8H4L3 6z"/><path d="M1 4h14"/><path d="M6 4V2h4v2"/>
        </svg>
        Clear
      </button>
      <button class="toolbar-btn" id="btn-open" data-tooltip="Open File (Ctrl+O)">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4a1 1 0 011-1h3l1.5 2H13a1 1 0 011 1v6a1 1 0 01-1 1H3a1 1 0 01-1-1V4z"/>
        </svg>
        Open
      </button>
      <button class="toolbar-btn" id="btn-save" data-tooltip="Save File (Ctrl+S)">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2h8l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z"/><rect x="5" y="9" width="6" height="5" rx="0.5"/><path d="M5 2v4h6V2"/>
        </svg>
        Save
      </button>
      <div class="toolbar-divider"></div>
      <button class="toolbar-btn" id="btn-console" data-tooltip="Toggle Console">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="14" height="10" rx="1.5"/><path d="M4 7l3 3-3 3"/><line x1="9" y1="13" x2="13" y2="13"/>
        </svg>
        Console
      </button>
      <button class="toolbar-btn kill-btn" id="btn-kill" data-tooltip="Kill Roblox Process">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="6"/><line x1="5" y1="5" x2="11" y2="11"/><line x1="11" y1="5" x2="5" y2="11"/>
        </svg>
        Kill Roblox
      </button>
      <div class="toolbar-divider"></div>
      <button class="toolbar-btn" id="btn-theme" data-tooltip="Change Theme">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="5"/><path d="M8 3v5l3 3"/>
        </svg>
        Theme
      </button>
      <button class="toolbar-btn" id="btn-settings" data-tooltip="Settings">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
        </svg>
        Settings
      </button>
    </div>
    <div class="toolbar-right">
      <button class="toolbar-btn attach-btn" id="btn-attach" data-tooltip="Attach to Roblox">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 2L14 6L6 14L2 10L10 2Z"/><line x1="7" y1="1" x2="11" y2="5"/>
        </svg>
        <span class="btn-label">Attach</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="main-content">

    <!-- Editor Area -->
    <div class="editor-area" id="editor-area">
      <div id="monaco-editor"></div>

      <!-- Console Panel -->
      <div class="console-panel" id="console-panel">
        <div class="console-header">
          <span class="console-title">
            <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="3" width="14" height="10" rx="1.5"/><path d="M4 7l3 3-3 3"/></svg>
            Console Output
          </span>
          <div class="console-actions">
            <button class="console-action-btn" id="btn-clear-console" title="Clear Console">
              <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h10l-1 8H4L3 6z"/><path d="M1 4h14"/></svg>
            </button>
            <button class="console-action-btn" id="btn-close-console" title="Close Console">
              <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></svg>
            </button>
          </div>
        </div>
        <div class="console-output" id="console-output"></div>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="statusbar" id="statusbar">
    <div class="statusbar-left">
      <span class="status-indicator" id="status-indicator">
        <span class="status-dot detached"></span>
        <span id="status-label">Not Attached</span>
      </span>
      <span class="statusbar-sep">|</span>
      <span class="status-item" id="status-bridge">Pages Preview</span>
      <span class="statusbar-sep">|</span>
      <span class="status-item" id="status-pid" hidden>PID -</span>
      <span class="statusbar-sep" id="status-pid-sep" hidden>|</span>
      <span class="status-item">Lua 5.1</span>
      <span class="statusbar-sep">|</span>
      <span class="status-item">UTF-8</span>
    </div>
    <div class="statusbar-right">
      <span class="status-item" id="status-cursor">Ln 1, Col 1</span>
      <span class="statusbar-sep">|</span>
      <span class="status-item" id="status-tab-name">untitled1.lua</span>
    </div>
  </div>

  <!-- Theme Picker Modal -->
  <div class="modal-overlay" id="theme-modal">
    <div class="modal glass-modal">
      <div class="modal-header">
        <span>Choose Theme</span>
        <button class="modal-close" id="theme-modal-close">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></svg>
        </button>
      </div>
      <div class="theme-grid">
        <button class="theme-card active" data-theme="nova-dark">
          <div class="theme-preview nova-dark-preview"></div>
          <span>Oblivion Dark</span>
        </button>
        <button class="theme-card" data-theme="midnight">
          <div class="theme-preview midnight-preview"></div>
          <span>Midnight</span>
        </button>
        <button class="theme-card" data-theme="dracula">
          <div class="theme-preview dracula-preview"></div>
          <span>Dracula</span>
        </button>
        <button class="theme-card" data-theme="one-dark">
          <div class="theme-preview one-dark-preview"></div>
          <span>One Dark</span>
        </button>
        <button class="theme-card" data-theme="github-dark">
          <div class="theme-preview github-dark-preview"></div>
          <span>GitHub Dark</span>
        </button>
        <button class="theme-card" data-theme="synthwave">
          <div class="theme-preview synthwave-preview"></div>
          <span>Synthwave</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal glass-modal settings-modal">
      <div class="modal-header">
        <span>Settings</span>
        <button class="modal-close" id="settings-modal-close">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <h3 class="settings-section-title">Editor</h3>
          <div class="settings-row">
            <label>Font Size</label>
            <div class="settings-control">
              <input type="range" min="10" max="24" value="14" id="setting-font-size" class="slider" />
              <span class="slider-value" id="setting-font-size-val">14px</span>
            </div>
          </div>
          <div class="settings-row">
            <label>Font Family</label>
            <select class="settings-select" id="setting-font">
              <option value="JetBrains Mono">JetBrains Mono</option>
              <option value="Consolas">Consolas</option>
              <option value="Fira Code">Fira Code</option>
              <option value="monospace">System Mono</option>
            </select>
          </div>
          <div class="settings-row">
            <label>Word Wrap</label>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-wordwrap" />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="settings-row">
            <label>Minimap</label>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-minimap" checked />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="settings-row">
            <label>Line Numbers</label>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-linenums" checked />
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>
        <div class="settings-section">
          <h3 class="settings-section-title">Window</h3>
          <div class="settings-row">
            <label>Opacity</label>
            <div class="settings-control">
              <input type="range" min="70" max="100" value="100" id="setting-opacity" class="slider" />
              <span class="slider-value" id="setting-opacity-val">100%</span>
            </div>
          </div>
          <div class="settings-row">
            <label>Show Status Bar</label>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-statusbar" checked />
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>
        <div class="settings-section">
          <h3 class="settings-section-title">Backend</h3>
          <div class="settings-row">
            <label>Discord RPC</label>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-discord-rpc" checked />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="settings-row">
            <label>Auto Attach</label>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-auto-attach" />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="settings-row">
            <label>Auto Execute</label>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-auto-execute" />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="settings-row">
            <label>Always On Top</label>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-always-on-top" />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="settings-row settings-row-stack">
            <label for="setting-rpc-details">RPC Details</label>
            <input class="settings-input" id="setting-rpc-details" type="text" value="OblivionX Executor" />
          </div>
          <div class="settings-row settings-row-stack">
            <label for="setting-rpc-state">RPC State</label>
            <input class="settings-input" id="setting-rpc-state" type="text" value="Idle" />
          </div>
        </div>
        <div class="settings-section">
          <h3 class="settings-section-title">About</h3>
          <div class="settings-about">
            <div class="about-logo">N</div>
            <div class="about-info">
              <div class="about-name">OblivionX</div>
              <div class="about-version">v1.0.0 · UI Preview</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="bridge.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
