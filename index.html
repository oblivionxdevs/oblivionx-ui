<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OblivionX Engine</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --accent:#8c5aff;
    --accent2:#b388ff;
    --bg:#050505;
    --panel:#0b0b0b;
    --panel2:#101010;
    --border:rgba(255,255,255,.08);
    --text:#f5f5f5;
    --text-dim:#9d9d9d;
    --danger:#ff4d67;
    --success:#39ff88;
    --shadow:0 0 30px rgba(140,90,255,.25);
    --font:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
}

body.theme-purple{
    --accent:#8c5aff;
    --accent2:#b388ff;
}
body.theme-blue{
    --accent:#00b7ff;
    --accent2:#6fdfff;
}
body.theme-red{
    --accent:#ff3f6c;
    --accent2:#ff8da6;
}
body.theme-green{
    --accent:#00ff88;
    --accent2:#7affc1;
}
body.theme-orange{
    --accent:#ff8a00;
    --accent2:#ffc266;
}

#weather-canvas{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.app{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:54px;
    background:rgba(10,10,10,.9);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    backdrop-filter:blur(20px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:34px;
    height:34px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),transparent);
    box-shadow:var(--shadow);
}

.brand h1{
    font-size:15px;
    letter-spacing:1px;
    font-weight:700;
}

.status{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color:var(--text-dim);
}

.attach-indicator-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#444;
}
.attach-indicator-dot.active{
    background:var(--success);
    box-shadow:0 0 15px var(--success);
}
.attach-indicator-dot.failed{
    background:var(--danger);
    box-shadow:0 0 15px var(--danger);
}

.window-controls{
    display:flex;
    align-items:center;
    gap:10px;
}

.window-btn{
    width:36px;
    height:36px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.window-btn:hover{
    background:rgba(255,255,255,.08);
}

.window-btn.close:hover{
    background:var(--danger);
}

.window-btn svg{
    width:16px;
    height:16px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.main{
    flex:1;
    display:flex;
    overflow:hidden;
}

.sidebar{
    width:78px;
    background:rgba(12,12,12,.9);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 0;
    gap:12px;
    backdrop-filter:blur(20px);
}

.side-btn{
    width:52px;
    height:52px;
    border-radius:18px;
    border:1px solid transparent;
    background:rgba(255,255,255,.04);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.side-btn:hover{
    border-color:var(--accent);
    box-shadow:0 0 18px rgba(140,90,255,.25);
}

.side-btn svg{
    width:22px;
    height:22px;
    stroke:var(--accent2);
    fill:none;
    stroke-width:2;
}

.workspace{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.tabs{
    height:48px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    background:rgba(15,15,15,.85);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
}

.tab{
    min-width:140px;
    height:34px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    border:1px solid transparent;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    font-size:12px;
    cursor:pointer;
    transition:.2s;
    font-family:var(--font-mono);
}

.tab.active{
    border-color:var(--accent);
    background:rgba(140,90,255,.14);
}

.close-x{
    opacity:.6;
    transition:.2s;
}

.close-x:hover{
    opacity:1;
    color:var(--danger);
}

.editor-shell{
    flex:1;
    position:relative;
}

#editor{
    width:100%;
    height:100%;
}

.bottom-bar{
    height:52px;
    border-top:1px solid var(--border);
    background:rgba(10,10,10,.9);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    backdrop-filter:blur(20px);
}

.action-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.action-btn{
    height:38px;
    padding:0 18px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.05);
    color:white;
    cursor:pointer;
    transition:.2s;
    font-weight:600;
}

.action-btn:hover{
    transform:translateY(-1px);
}

.action-btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    box-shadow:var(--shadow);
}

.cli{
    width:280px;
    height:38px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    color:white;
    padding:0 14px;
    font-family:var(--font-mono);
    border:1px solid var(--border);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    backdrop-filter:blur(8px);
}

.modal-card{
    width:850px;
    max-width:95vw;
    height:680px;
    max-height:92vh;
    border-radius:28px;
    background:#0d0d0d;
    border:1px solid var(--border);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 50px rgba(0,0,0,.5);
}

.modal-header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    border-bottom:1px solid var(--border);
}

.modal-title{
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
}

.modal-body{
    flex:1;
    overflow:auto;
    padding:24px;
}

.settings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
}

.setting-card{
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    border-radius:22px;
    padding:20px;
}

.setting-card h3{
    margin-bottom:16px;
    font-size:14px;
}

.setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    font-size:13px;
}

.setting-row input[type="checkbox"]{
    width:18px;
    height:18px;
    accent-color:var(--accent);
}

.setting-row select,
.setting-row input[type="text"]{
    background:#111;
    color:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 10px;
    width:140px;
}

.script-hub-toolbar{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.hub-tab{
    height:38px;
    padding:0 18px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,.05);
    color:white;
    cursor:pointer;
}

.hub-tab.active{
    background:var(--accent);
}

#hub-search-input{
    flex:1;
    background:#111;
    border:1px solid var(--border);
    color:white;
    border-radius:12px;
    padding:0 14px;
}

.script-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
}

.script-card-item{
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:16px;
}

.script-title-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.script-title{
    font-weight:700;
    font-size:14px;
}

.script-desc{
    color:var(--text-dim);
    font-size:12px;
    margin-top:10px;
    line-height:1.6;
}

.script-card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.catalog-action-btn{
    border:none;
    background:var(--accent);
    color:white;
    height:34px;
    padding:0 14px;
    border-radius:10px;
    cursor:pointer;
}

.script-meta-metrics{
    display:flex;
    flex-direction:column;
    gap:4px;
    font-size:11px;
    color:var(--text-dim);
    font-family:var(--font-mono);
}

.script-badge{
    font-size:10px;
    padding:4px 7px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
}

.script-badge.verified{
    background:#1f7a42;
}
.script-badge.universal{
    background:#3158ff;
}
.script-badge.patched{
    background:#923535;
}

#hub-catalog-status{
    margin-bottom:18px;
    color:var(--text-dim);
    font-size:12px;
    font-family:var(--font-mono);
}

::-webkit-scrollbar{
    width:7px;
    height:7px;
}
::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.1);
    border-radius:999px;
}
</style>
</head>

<body class="theme-purple">

<canvas id="weather-canvas"></canvas>

<div class="app">

    <div class="topbar">
        <div class="brand">
            <div class="brand-logo"></div>
            <h1>OBLIVIONX ENGINE</h1>
        </div>

        <div class="status">
            <div class="attach-indicator-dot" id="top-attach-dot"></div>
            <span id="status-text">Not Attached</span>
        </div>

        <div class="window-controls">
            <button class="window-btn" onclick="openModal('settings-modal')">
                <span data-icon="settings"></span>
            </button>

            <button class="window-btn" onclick="minimize()">
                <span data-icon="minus"></span>
            </button>

            <button class="window-btn close" onclick="closeApp()">
                <span data-icon="x"></span>
            </button>
        </div>
    </div>

    <div class="main">

        <div class="sidebar">

            <button class="side-btn" onclick="createNewTab()">
                <span data-icon="layers"></span>
            </button>

            <button class="side-btn" onclick="openScriptHub()">
                <span data-icon="settings"></span>
            </button>

        </div>

        <div class="workspace">

            <div class="tabs" id="tab-container"></div>

            <div class="editor-shell">
                <div id="editor"></div>
            </div>

            <div class="bottom-bar">

                <div class="action-row">
                    <button class="action-btn" onclick="sendWebviewMessage({action:'inject'})">
                        Inject
                    </button>

                    <button class="action-btn primary" onclick="getEditorBuffer()">
                        Execute
                    </button>

                    <button class="action-btn" onclick="openScriptHub()">
                        Script Hub
                    </button>
                </div>

                <input class="cli" id="cli" placeholder="/inject  /run  /new  /topmost"/>
            </div>

        </div>

    </div>

</div>

<!-- SETTINGS -->

<div class="modal" id="settings-modal" onclick="closeModalOnOuter(event,'settings-modal')">
    <div class="modal-card">

        <div class="modal-header">
            <div class="modal-title">SETTINGS MATRIX</div>

            <button class="window-btn close" onclick="closeModal('settings-modal')">
                <span data-icon="x"></span>
            </button>
        </div>

        <div class="modal-body">

            <div class="settings-grid">

                <div class="setting-card">
                    <h3>Core</h3>

                    <div class="setting-row">
                        <span>Discord RPC</span>
                        <input type="checkbox" id="cfg-discord" onchange="pushConfigUpdate()">
                    </div>

                    <div class="setting-row">
                        <span>Auto Attach</span>
                        <input type="checkbox" id="cfg-attach" onchange="pushConfigUpdate()">
                    </div>

                    <div class="setting-row">
                        <span>Auto Execute</span>
                        <input type="checkbox" id="cfg-execute" onchange="pushConfigUpdate()">
                    </div>

                    <div class="setting-row">
                        <span>Always On Top</span>
                        <input type="checkbox" id="cfg-topmost" onchange="pushConfigUpdate()">
                    </div>
                </div>

                <div class="setting-card">
                    <h3>Appearance</h3>

                    <div class="setting-row">
                        <span>Theme</span>

                        <select id="cfg-theme" onchange="applyGlobalTheme(this.value)">
                            <option value="purple">Purple</option>
                            <option value="blue">Blue</option>
                            <option value="red">Red</option>
                            <option value="green">Green</option>
                            <option value="orange">Orange</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <span>Weather FX</span>

                        <select id="cfg-weather" onchange="setWeatherEffect(this.value)">
                            <option value="none">None</option>
                            <option value="matrix">Matrix</option>
                            <option value="cybergrid">Cyber Grid</option>
                            <option value="hyperjump">Hyperjump</option>
                            <option value="stars">Stars</option>
                            <option value="rain">Rain</option>
                            <option value="snow">Snow</option>
                        </select>
                    </div>
                </div>

                <div class="setting-card">
                    <h3>Discord Presence</h3>

                    <div class="setting-row" id="rpc-details-row">
                        <span>Details</span>
                        <input type="text" id="cfg-rpc-details" value="OblivionX Executor" oninput="pushRpcMessageUpdate()">
                    </div>

                    <div class="setting-row" id="rpc-state-row">
                        <span>State</span>
                        <input type="text" id="cfg-rpc-state" value="Idle" oninput="pushRpcMessageUpdate()">
                    </div>
                </div>

            </div>

        </div>

    </div>
</div>

<!-- SCRIPT HUB -->

<div class="modal" id="script-hub-modal" onclick="closeModalOnOuter(event,'script-hub-modal')">

    <div class="modal-card">

        <div class="modal-header">

            <div class="modal-title">SCRIPT HUB</div>

            <button class="window-btn close" onclick="closeModal('script-hub-modal')">
                <span data-icon="x"></span>
            </button>

        </div>

        <div class="modal-body">

            <div class="script-hub-toolbar">

                <button class="hub-tab active" id="hub-tab-trending" onclick="switchHubFilter('trending')">
                    Trending
                </button>

                <button class="hub-tab" id="hub-tab-latest" onclick="switchHubFilter('latest')">
                    Latest
                </button>

                <input id="hub-search-input" placeholder="Search scripts..." onkeydown="handleHubSearchKey(event)">

                <button class="catalog-action-btn" onclick="triggerHubQuerySearch()">
                    Search
                </button>

            </div>

            <div id="hub-catalog-status">READY</div>

            <div class="script-grid" id="hub-catalog-list"></div>

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>

<script>
const VectorDictionary = {
    minus: `<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>`,
    x: `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`,
    settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82"></path></svg>`,
    layers: `<svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>`
};

function renderApplicationIcons(){
    document.querySelectorAll('[data-icon]').forEach(element=>{
        const iconName = element.getAttribute('data-icon');
        if(VectorDictionary[iconName]){
            element.innerHTML = VectorDictionary[iconName];
        }
    });
}

renderApplicationIcons();

let editor;
let tabModels = {};
let files = JSON.parse(localStorage.getItem('obv_fs')) || {
    "main.lua":"-- Workspace Active\nprint('OblivionX Engine Pro Ready.')"
};
let current = Object.keys(files)[0] || "main.lua";
let topmost = false;
let activeHubFilter = "trending";

function sendWebviewMessage(payload){
    if(window.chrome && window.chrome.webview){
        window.chrome.webview.postMessage(payload);
    } else {
        console.log("[IPC]",payload);
    }
}

require.config({
    paths:{
        vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.0/min/vs"
    }
});

require(["vs/editor/editor.main"],function(){

    Object.keys(files).forEach(f=>{
        tabModels[f]=monaco.editor.createModel(files[f],"lua");
    });

    editor = monaco.editor.create(document.getElementById("editor"),{
        model:tabModels[current],
        theme:"vs-dark",
        automaticLayout:true,
        minimap:{enabled:false},
        fontSize:13,
        fontFamily:"JetBrains Mono",
        lineHeight:22,
        smoothScrolling:true
    });

    editor.onDidChangeModelContent(()=>{
        save();
    });

    renderTabs();

    applyGlobalTheme(localStorage.getItem('obv_theme') || 'purple');
    setWeatherEffect(localStorage.getItem('obv_weather') || 'matrix');

    document.getElementById('cfg-discord').checked = localStorage.getItem('obv_cfg_discord') !== 'false';
    document.getElementById('cfg-attach').checked = localStorage.getItem('obv_cfg_attach') === 'true';
    document.getElementById('cfg-execute').checked = localStorage.getItem('obv_cfg_execute') === 'true';
    document.getElementById('cfg-topmost').checked = localStorage.getItem('obv_cfg_topmost') === 'true';
});

function save(){
    if(editor && tabModels[current]){
        files[current] = tabModels[current].getValue();
        localStorage.setItem('obv_fs',JSON.stringify(files));
    }
}

function getEditorBuffer(){
    sendWebviewMessage({
        action:"execute",
        code:editor.getValue()
    });
}

function renderTabs(){
    const container = document.getElementById("tab-container");
    container.innerHTML = "";

    Object.keys(files).forEach(f=>{
        const tab = document.createElement("div");
        tab.className = "tab" + (f===current ? " active":"");

        tab.innerHTML = `
            <span>${f}</span>
            <span class="close-x"
                onclick="event.stopPropagation();closeTab('${f}')">×</span>
        `;

        tab.onclick = ()=>switchActiveBuffer(f);

        container.appendChild(tab);
    });
}

function switchActiveBuffer(fileName){
    save();
    current = fileName;
    editor.setModel(tabModels[fileName]);
    renderTabs();
}

function createNewTab(title=null,initialContent=""){
    save();

    let n = title || "script_" + (Object.keys(files).length+1)+".lua";

    if(files[n]){
        n = "script_" + Math.floor(Math.random()*1000)+".lua";
    }

    files[n] = initialContent || "-- New Script";
    tabModels[n] = monaco.editor.createModel(files[n],"lua");

    current = n;

    editor.setModel(tabModels[n]);

    renderTabs();

    save();
}

function closeTab(f){
    if(Object.keys(files).length <= 1) return;

    tabModels[f].dispose();
    delete tabModels[f];
    delete files[f];

    if(current===f){
        current = Object.keys(files)[0];
    }

    editor.setModel(tabModels[current]);

    renderTabs();

    save();
}

function openModal(id){
    document.getElementById(id).style.display='flex';
}

function closeModal(id){
    document.getElementById(id).style.display='none';
}

function closeModalOnOuter(e,id){
    if(e.target.id===id){
        closeModal(id);
    }
}

function applyGlobalTheme(name){
    document.body.className = "theme-" + name;

    localStorage.setItem('obv_theme',name);

    document.getElementById('cfg-theme').value = name;

    setTimeout(()=>{
        const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim();
        const bg = getComputedStyle(document.body).getPropertyValue('--bg').trim();

        monaco.editor.defineTheme('obv-theme',{
            base:'vs-dark',
            inherit:true,
            rules:[],
            colors:{
                'editor.background':bg,
                'editorCursor.foreground':accent,
                'editorLineNumber.activeForeground':accent
            }
        });

        monaco.editor.setTheme('obv-theme');
    },50);

    sendWebviewMessage({
        action:"theme",
        value:name
    });
}

function pushConfigUpdate(){

    const config = {
        discordRpc:document.getElementById('cfg-discord').checked,
        autoAttach:document.getElementById('cfg-attach').checked,
        autoExecute:document.getElementById('cfg-execute').checked,
        alwaysOnTop:document.getElementById('cfg-topmost').checked
    };

    localStorage.setItem('obv_cfg_discord',config.discordRpc);
    localStorage.setItem('obv_cfg_attach',config.autoAttach);
    localStorage.setItem('obv_cfg_execute',config.autoExecute);
    localStorage.setItem('obv_cfg_topmost',config.alwaysOnTop);

    sendWebviewMessage({
        action:"update_config",
        settings:config
    });
}

function pushRpcMessageUpdate(){

    const d = document.getElementById('cfg-rpc-details').value;
    const s = document.getElementById('cfg-rpc-state').value;

    localStorage.setItem('obv_rpc_details',d);
    localStorage.setItem('obv_rpc_state',s);

    sendWebviewMessage({
        action:'update_rpc_details',
        details:d,
        state:s
    });
}

function updateStatusUI(mode,pid=null){

    const dot = document.getElementById('top-attach-dot');
    const txt = document.getElementById('status-text');

    if(mode==='attached'){
        dot.className = "attach-indicator-dot active";
        txt.innerText = "Attached ("+pid+")";
    }
    else if(mode==='failed'){
        dot.className = "attach-indicator-dot failed";
        txt.innerText = "Attachment Failed";
    }
    else{
        dot.className = "attach-indicator-dot";
        txt.innerText = "Not Attached";
    }
}

function minimize(){
    sendWebviewMessage({action:"minimize"});
}

function closeApp(){
    sendWebviewMessage({action:"exit"});
}

function openScriptHub(){
    openModal('script-hub-modal');
    switchHubFilter(activeHubFilter);
}

function switchHubFilter(mode){

    activeHubFilter = mode;

    document.getElementById("hub-tab-trending").classList.toggle("active",mode==='trending');
    document.getElementById("hub-tab-latest").classList.toggle("active",mode==='latest');

    updateHubStatus("FETCHING_STREAM");

    sendWebviewMessage({
        action:"scriptblox_fetch_trending",
        filter:mode
    });
}

function triggerHubQuerySearch(){

    const query = document.getElementById('hub-search-input').value.trim();

    if(!query){
        switchHubFilter(activeHubFilter);
        return;
    }

    updateHubStatus("QUERYING_MATRIX");

    sendWebviewMessage({
        action:"scriptblox_search",
        query:query
    });
}

function handleHubSearchKey(e){
    if(e.key==="Enter"){
        triggerHubQuerySearch();
    }
}

function updateHubStatus(text){
    document.getElementById('hub-catalog-status').innerText = text;
}

function populateScriptHubCatalog(responseObj){

    const listContainer = document.getElementById('hub-catalog-list');

    listContainer.innerHTML = "";

    let scriptsArray = responseObj?.scripts || responseObj?.result || responseObj?.data || responseObj;

    if(!scriptsArray || scriptsArray.length===0){
        updateHubStatus("NULL_MATRIX");
        return;
    }

    updateHubStatus("RENDERED_" + scriptsArray.length + "_ASSETS");

    scriptsArray.forEach(item=>{

        let badgesHtml = "";

        if(item.universal){
            badgesHtml += `<span class="script-badge universal">Universal</span>`;
        }

        if(item.verified){
            badgesHtml += `<span class="script-badge verified">Verified</span>`;
        }

        if(item.patched){
            badgesHtml += `<span class="script-badge patched">Patched</span>`;
        }

        const card = document.createElement('div');

        card.className = "script-card-item";

        card.innerHTML = `
            <div>
                <div class="script-title-row">
                    <span class="script-title">${item.title || "Unnamed Script"}</span>
                    <div>${badgesHtml}</div>
                </div>

                <div class="script-desc">
                    ${item.description || item.features || "No description attached."}
                </div>
            </div>

            <div class="script-card-footer">

                <div class="script-meta-metrics">
                    <span>Views: ${item.views || 0}</span>
                    <span>${item.game?.name || "Universal"}</span>
                </div>

                <button class="catalog-action-btn"
                    onclick="requestRawScript('${item._id || item.id}','${(item.title || 'script').replace(/'/g,"")}')">
                    Load
                </button>

            </div>
        `;

        listContainer.appendChild(card);
    });
}

function requestRawScript(scriptId,cleanTitle){

    updateHubStatus("STREAM_CODE");

    sendWebviewMessage({
        action:"scriptblox_get_raw",
        id:scriptId,
        title:cleanTitle
    });
}

function injectRawScriptIntoEditor(slugTitle,rawCode){

    closeModal('script-hub-modal');

    let workspaceTitle = slugTitle.toLowerCase().replace(/\s+/g,'_') + ".lua";

    createNewTab(workspaceTitle,rawCode);
}

document.getElementById("cli").addEventListener("keydown",e=>{

    if(e.key==="Enter"){

        const cmd = e.target.value.trim().toLowerCase();

        if(cmd==="/run"){
            getEditorBuffer();
        }

        if(cmd==="/inject"){
            sendWebviewMessage({action:"inject"});
        }

        if(cmd==="/new"){
            createNewTab();
        }

        if(cmd==="/topmost"){
            document.getElementById('cfg-topmost').checked =
                !document.getElementById('cfg-topmost').checked;

            pushConfigUpdate();
        }

        e.target.value = "";
    }
});

const canvas = document.getElementById('weather-canvas');
const ctx = canvas.getContext('2d');

let animationId;
let weatherMode = 'matrix';

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener('resize',resizeCanvas);

resizeCanvas();

let matrixParticles = [];
let warpStars = [];
let environmentDrops = [];

function initWeather(mode){

    matrixParticles = [];
    warpStars = [];
    environmentDrops = [];

    const cols = Math.floor(canvas.width / 14) + 1;

    if(mode==='matrix'){

        for(let i=0;i<cols;i++){

            matrixParticles.push({
                x:i*14,
                y:Math.random()*-500,
                speed:2 + Math.random()*5
            });
        }
    }

    else if(mode==='hyperjump' || mode==='stars'){

        for(let i=0;i<150;i++){

            warpStars.push({
                x:Math.random()*canvas.width,
                y:Math.random()*canvas.height,
                z:Math.random()*canvas.width
            });
        }
    }

    else if(mode==='rain' || mode==='snow'){

        for(let i=0;i<120;i++){

            environmentDrops.push({
                x:Math.random()*canvas.width,
                y:Math.random()*canvas.height,
                speed:4 + Math.random()*6,
                size:1 + Math.random()*3
            });
        }
    }
}

function setWeatherEffect(mode){

    weatherMode = mode;

    localStorage.setItem('obv_weather',mode);

    document.getElementById('cfg-weather').value = mode;

    cancelAnimationFrame(animationId);

    if(mode!=='none'){
        initWeather(mode);
        renderWeatherLoop();
    } else {
        ctx.clearRect(0,0,canvas.width,canvas.height);
    }

    sendWebviewMessage({
        action:'set_weather',
        weather:mode
    });
}

function renderWeatherLoop(){

    const accentColor = getComputedStyle(document.body)
        .getPropertyValue('--accent')
        .trim();

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(weatherMode==='matrix'){

        ctx.font = '11px monospace';

        matrixParticles.forEach(p=>{

            ctx.fillStyle = accentColor;

            ctx.fillText(
                String.fromCharCode(0x30A0 + Math.random()*96),
                p.x,
                p.y
            );

            p.y += p.speed;

            if(p.y > canvas.height){
                p.y = -50;
            }
        });
    }

    else if(weatherMode==='cybergrid'){

        ctx.strokeStyle = accentColor;

        const step = 45;
        const offset = (Date.now()/30)%step;

        for(let x=offset;x<canvas.width;x+=step){
            ctx.beginPath();
            ctx.moveTo(x,0);
            ctx.lineTo(x,canvas.height);
            ctx.stroke();
        }

        for(let y=offset;y<canvas.height;y+=step){
            ctx.beginPath();
            ctx.moveTo(0,y);
            ctx.lineTo(canvas.width,y);
            ctx.stroke();
        }
    }

    else if(weatherMode==='hyperjump'){

        warpStars.forEach(s=>{

            s.z -= 8;

            if(s.z<=0){
                s.z = canvas.width;
            }

            const cx = canvas.width/2;
            const cy = canvas.height/2;

            const px = (s.x-cx)*(canvas.width/s.z)+cx;
            const py = (s.y-cy)*(canvas.width/s.z)+cy;

            ctx.strokeStyle = "#fff";

            ctx.beginPath();
            ctx.moveTo(px,py);
            ctx.lineTo(px+(px-cx)*0.09,py+(py-cy)*0.09);
            ctx.stroke();
        });
    }

    else if(weatherMode==='stars'){

        warpStars.forEach(s=>{

            ctx.fillStyle = "#fff";

            ctx.fillRect(s.x,s.y,1.5,1.5);

            s.y += .2;

            if(s.y > canvas.height){
                s.y = 0;
            }
        });
    }

    else if(weatherMode==='rain'){

        ctx.strokeStyle = accentColor;

        environmentDrops.forEach(d=>{

            ctx.beginPath();
            ctx.moveTo(d.x,d.y);
            ctx.lineTo(d.x+1,d.y+12);
            ctx.stroke();

            d.y += d.speed;

            if(d.y > canvas.height){
                d.y = -20;
            }
        });
    }

    else if(weatherMode==='snow'){

        ctx.fillStyle = '#fff';

        environmentDrops.forEach(d=>{

            ctx.beginPath();
            ctx.arc(d.x,d.y,d.size/2,0,Math.PI*2);
            ctx.fill();

            d.y += d.speed * .25;

            if(d.y > canvas.height){
                d.y = -10;
            }
        });
    }

    animationId = requestAnimationFrame(renderWeatherLoop);
}
</script>
